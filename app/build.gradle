plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'dagger.hilt.android.plugin'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.devtools.ksp'
}

apply plugin: 'com.android.application'
//apply plugin: 'com.google.dagger.hilt.android'
apply plugin: "androidx.navigation.safeargs"

android {
    compileSdk 37


    defaultConfig {
        applicationId "com.quigglesproductions.secureimageviewer"
        minSdkVersion 33
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 37
        versionCode 4
        versionName '2.5.0'
        android.defaultConfig.manifestPlaceholders = [
                'appAuthRedirectScheme': 'siv'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "+debug"
            applicationIdSuffix ".debug"
            debuggable true
            buildConfigField('String', 'SERVER_URL', "\"https://quigleyserver.ddns.net:14500/api/v2/info/metadata\"")
            signingConfig signingConfigs.debug
        }
        benchmark {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField('String', 'SERVER_URL', "\"https://quigleyserver.ddns.net:14500/api/v2/info/metadata\"")
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.quigglesproductions.secureimageviewer'
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    lint {
        baseline file('lint-baseline.xml')
    }
}
def mediaVersion = "1.10.1"
def acraVersion = '5.13.1'
def paging_version = "3.5.0"
def roomVersion = "2.8.4"
def work_version = "2.11.2"
def navVersion = "2.9.8"
def lifecycleVersion = "2.10.0"
def okHttpVersion = "5.4.0"
def retrofitVersion = "3.0.0"
def glideVersion = "5.0.7"

dependencies {
    implementation "androidx.lifecycle:lifecycle-process:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.gu.android:toolargetool:0.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.navigation:navigation-fragment-ktx:$navVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navVersion"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'net.openid:appauth:0.11.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-ui:$mediaVersion"
    implementation "androidx.media3:media3-session:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer-dash:$mediaVersion"
    implementation "androidx.media3:media3-cast:$mediaVersion"
    implementation "androidx.media3:media3-datasource-okhttp:$mediaVersion"
    implementation "androidx.biometric:biometric:1.1.0"

    implementation 'com.github.mike14u:shimmer-recyclerview-x:1.0.4'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.core:core-ktx:1.19.0'

    testImplementation 'androidx.test:core:1.7.0'

    implementation 'com.techyourchance:threadposter:1.0.1'

    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.okhttp3:okhttp:$okHttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$okHttpVersion"


    //Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'
    ksp "com.google.dagger:hilt-android-compiler:2.59.2"
    ksp "androidx.hilt:hilt-compiler:1.3.0"
    implementation 'androidx.hilt:hilt-navigation-fragment:1.3.0'
    implementation "androidx.hilt:hilt-work:1.3.0"

    //implementation("com.github.bumptech.glide:okhttp3-integration:$glideVersion"){
    //    exclude group: 'glide-parent'
    //}

    implementation "ch.acra:acra-http:$acraVersion"
    implementation "ch.acra:acra-core:$acraVersion"
    implementation "ch.acra:acra-dialog:$acraVersion"
    implementation "ch.acra:acra-notification:$acraVersion"
    implementation "ch.acra:acra-toast:$acraVersion"
    implementation "ch.acra:acra-advanced-scheduler:$acraVersion"
    
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    ksp "com.github.bumptech.glide:ksp:$glideVersion"
    implementation "com.github.bumptech.glide:okhttp3-integration:$glideVersion"
    implementation ("com.github.bumptech.glide:recyclerview-integration:$glideVersion") {
        // Excludes the support library because it's already included by Glide.
        transitive = false
    }
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.github.MikeOrtiz:TouchImageView:1.4.1'

    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.easymock:easymock:5.6.0'

    //Room
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-guava:$roomVersion"
    implementation "androidx.room:room-paging:$roomVersion"
    implementation("androidx.room:room-ktx:$roomVersion")


    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    //Paging 3
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"
    implementation "androidx.paging:paging-rxjava3:$paging_version"
    implementation "androidx.paging:paging-guava:$paging_version"

    //Work
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation "androidx.work:work-multiprocess:$work_version"
    androidTestImplementation("androidx.work:work-testing:$work_version")

    implementation "com.github.skydoves:retrofit-adapters-paging:1.1.0"

    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-perf")

    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'jp.co.cyberagent.android:gpuimage:2.1.0'

    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
